<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Silkgate</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root{--bg:#eef2f4;--ink:#14222e;--muted:#5a6b78;--accent:#0d5c78;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0f171d;--ink:#e6edf1;--muted:#93a4b0;--accent:#5cb3d1;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;text-align:center}
h1{font-size:24px;margin:12px 0 6px}
p{color:var(--muted);margin:0 0 16px}
a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div>
  <img src="/logo.svg" alt="" width="48" height="48">
  <h1>Sayfa bulunamadı</h1>
  <p>Aradığın sayfa burada değil.</p>
  <a href="/">Silkgate ana sayfası</a>
</div>
</body>
</html>
